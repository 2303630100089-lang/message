apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsesphere-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulsesphere-auth
  template:
    metadata:
      labels:
        app: pulsesphere-auth
    spec:
      containers:
        - name: auth
          image: pulsesphere/auth:latest
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: pulsesphere-auth
spec:
  selector:
    app: pulsesphere-auth
  ports:
    - port: 80
      targetPort: 8081
