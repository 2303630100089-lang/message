apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsesphere-messaging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulsesphere-messaging
  template:
    metadata:
      labels:
        app: pulsesphere-messaging
    spec:
      containers:
        - name: messaging
          image: pulsesphere/messaging:latest
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: pulsesphere-messaging
spec:
  selector:
    app: pulsesphere-messaging
  ports:
    - port: 80
      targetPort: 8082
